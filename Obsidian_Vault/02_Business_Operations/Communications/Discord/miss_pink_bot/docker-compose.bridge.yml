name: miss-pink-fleet-bridge
services:
  # Tailscale sidecar for secure mesh access
  ts-bridge:
    image: tailscale/tailscale:stable
    hostname: miss-pink-bridge
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-routes=100.64.0.0/10
    volumes:
      - ts-bridge-state:/var/lib/tailscale
      - ./bridge_config.json:/config/serve.json:ro
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  # Read-only Docker proxy
  docker-proxy:
    image: ghcr.io/portainer/agent:2.19.5
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: service:ts-bridge
    restart: unless-stopped

volumes:
  ts-bridge-state:
