# Intentionally empty — no Prometheus datasource is provisioned.
#
# The torus-local prometheus service was removed from docker-compose.torus.fleet.yml
# (Captain's call, 2026-10-04) because fleet-prometheus in
# D:\Work\Captain_Dashboard\fleet-monitoring\ already covers fleet monitoring.
#
# There is deliberately NO datasource configured here:
#   - a datasource pointing at the removed `prometheus:9090` would show Grafana a
#     broken connection on every load
#   - repointing at fleet-prometheus would require attaching grafana to the
#     fleet-monitoring_default network, which re-creates the duplicate monitoring
#     stack this cleanup was meant to remove
#
# Monitoring for this fleet lives at fleet-grafana (host 127.0.0.1:3030), backed by
# fleet-prometheus. Use that.
#
# If a Torus-specific datasource is ever needed, add it here with a reachable URL
# and re-add the bind mount in docker-compose.torus.fleet.yml.

apiVersion: 1

datasources: []